name: pos_resto
description: Aplikasi POS Restoran - Android Tablet
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Database
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # Network (cloud sync)
  dio: ^5.4.3+1

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_slidable: ^3.1.0

  # Printer
  flutter_bluetooth_serial: ^0.4.0
  network_info_plus: ^8.1.0
  permission_handler: ^12.0.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  crypto: ^3.0.3
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true