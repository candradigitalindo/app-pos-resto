<!doctype html>
<!--
  index.html — Application entry point
  Vite injects the <script type="module"> automatically during build.
  The #app div is where Vue mounts the root component.
-->
<html lang="id" class="h-full bg-gray-50">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud POS — Admin Panel</title>
    <meta name="description" content="Admin dashboard for Nusantara Cloud POS system" />
  </head>
  <body class="h-full">
    <!-- Vue mounts here. Do NOT remove or rename this element. -->
    <div id="app"></div>
    <!-- Vite replaces this comment with the built JS entry -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
